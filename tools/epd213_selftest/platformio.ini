; 2.13" 墨水屏点屏自检（iDevice ESP32-S3 板）
;
; 一个独立的最小 PlatformIO 工程，不依赖主固件、不依赖任何第三方库，
; 只用 Arduino 基础 API + 软件 SPI，专门用来确认「板 + 屏 + 接线」是否通。
;
; 编译：pio run
; 上传：pio run -t upload        （S3 原生 USB 需先按住 BOOT 再点 RST）
; 串口：pio device monitor

[env:epd213_selftest_s3]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 460800

; N16R8：16MB Flash + 8MB Octal PSRAM
; ⚠ 这块板实测只支持 DIO flash 模式：QIO 会在 image 加载阶段失败
;   （ets_loader.c 78 + TG0WDT_SYS_RESET）
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBUSY_ACTIVE_LOW       ; 实测这块屏 BUSY 低=忙（与 SSD1680 手册相反）
