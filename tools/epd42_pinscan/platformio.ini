; 4.2" 屏（HINK-E042A13-A0 / SSD1619A）在 iDevice S3 板上的
; 引脚指纹扫描 + 双极性点屏试探。
;
; 目的：刷完 LAST 日志 TIMEOUT、BUSY 恒 1 时，判断到底是
;   ① 屏没通电 / FPC 没接触
;   ② FPC 定义不同，BUSY/DC/RST 不在 GPIO 15/13/14 上
;   ③ 只是 BUSY 极性判反了
;
; 产物：epd42_pinscan_merged.bin（烧 0x0，DIO）

[env:epd42_pinscan]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 460800

; 这块板实测只支持 DIO（QIO 会在 image 加载阶段失败）
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
