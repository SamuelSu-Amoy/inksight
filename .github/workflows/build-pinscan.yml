name: Build EPD42 Pinscan

# 4.2" 屏在 iDevice S3 板上的引脚指纹扫描 + 双极性点屏诊断固件
# 产物：epd42_pinscan_merged.bin（烧 0x0，DIO）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio esptool

      - name: 缓存 PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-pinscan-${{ runner.os }}-${{ hashFiles('tools/epd42_pinscan/platformio.ini') }}
          restore-keys: pio-pinscan-${{ runner.os }}-

      - name: 编译
        working-directory: tools/epd42_pinscan
        run: pio run

      - name: 合并成单文件
        working-directory: tools/epd42_pinscan
        run: |
          mkdir -p ../../out
          B=.pio/build/epd42_pinscan
          cp "$B/bootloader.bin"  ../../out/epd42_pinscan_bootloader.bin
          cp "$B/partitions.bin"  ../../out/epd42_pinscan_partitions.bin
          cp "$B/firmware.bin"    ../../out/epd42_pinscan_firmware.bin
          ARGS="0x0 $B/bootloader.bin 0x8000 $B/partitions.bin"
          [ -f "$B/boot_app0.bin" ] && ARGS="$ARGS 0xe000 $B/boot_app0.bin"
          ARGS="$ARGS 0x10000 $B/firmware.bin"
          python -m esptool --chip esp32s3 merge_bin \
            -o ../../out/epd42_pinscan_merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB $ARGS
          ls -la ../../out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: epd42_pinscan
          path: out/*
          retention-days: 30
